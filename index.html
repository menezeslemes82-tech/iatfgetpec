<style>
:root{--navy:#14307a;--navy2:#0e2358;--green:#5aa51e;--green2:#3f7f12;--lg:#eaf5dc;--bg:#f3f6fa;--card:#fff;--tx:#18233d;--mut:#6a7690;--bd:#dde3ee;--red:#c0392b;--amb:#d9822b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy);text-decoration:none}
#app{min-height:100vh;padding-bottom:78px}
.hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.hdr img{height:34px;background:#fff;border-radius:6px;padding:2px}
.hdr h1{font-size:16px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.sec{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;margin:4px 0 10px;border-right:10px solid var(--green)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--navy);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.g{background:var(--green)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--bd)}.btn.red{background:var(--red)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:3px}.fld>span{font-size:12px;color:var(--mut);font-weight:600}.fld.full{grid-column:1/-1}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fff;min-height:42px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:var(--green)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg label{flex:1;min-width:70px}.seg input{position:absolute;opacity:0;pointer-events:none}
.seg b{display:block;text-align:center;padding:11px 8px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-weight:600;cursor:pointer}
.seg input:checked+b{background:var(--green);border-color:var(--green2);color:#fff}
.seg input:disabled+b{opacity:.45}
.chip{display:inline-block;background:var(--lg);color:var(--green2);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.chip.n{background:#e5ebf8;color:var(--navy)}.chip.r{background:#fbe5e2;color:var(--red)}.chip.a{background:#fdeedd;color:var(--amb)}
.lote{display:block;color:inherit}.lote h3{margin:0 0 2px}.lote small{color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--navy)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.tab.on.gr{background:var(--green);border-color:var(--green)}
.tab i{font-style:normal;font-size:11px;background:rgba(0,0,0,.12);border-radius:8px;padding:0 6px;margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px}.kpi b{display:block;font-size:24px;color:var(--navy)}.kpi span{font-size:12px;color:var(--mut)}
.kpi.p b{color:var(--green2)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-size:12px}td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.reg{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.reg:last-child{border:0}
.reg .t{flex:1;min-width:0;cursor:pointer}.reg b{font-size:15px}.reg small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:9px 4px;font-size:12px;color:var(--mut);font-weight:600}.nav a.on{color:var(--navy)}.nav a span{display:block;font-size:20px}
#toast{position:fixed;left:12px;right:12px;bottom:90px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#18233d;color:#fff;padding:10px 14px;border-radius:10px;max-width:520px;box-shadow:0 4px 14px rgba(0,0,0,.25)}#toast .w{background:var(--amb)}#toast .e{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(10,20,50,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}.modal.hidden{display:none}
.modal>div{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:16px}}
.note{background:var(--lg);border-radius:10px;padding:8px 10px;font-size:12.5px;color:#2d5410;margin-top:10px}
.warn{background:#fdeedd;color:#8a4b0f}
.banner{background:#fff4d6;color:#7a5a00;padding:6px 12px;font-size:12.5px;text-align:center}
.pill{display:inline-block;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:5px 9px;margin:3px 3px 0 0;font-weight:600;font-size:13px;cursor:pointer}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
.login{max-width:380px;margin:8vh auto;text-align:center}.login img{width:160px}
.empty{color:var(--mut);text-align:center;padding:18px}
</style>
</head>

<div id="toast"></div>
<div id="modal" class="modal hidden"></div>

const S={user:null,lotes:[],eventos:[],ready:false,tab:'d0',ciclo:1,loteId:null,editId:null,busca:'',keep:lsGet('gp_keep',{})};
let db=null,auth=null,unsubs=[],_evm=null;
const Store={
 init(){
  if(LOCAL){S.lotes=lsGet('gp_lotes',[]);S.eventos=lsGet('gp_eventos',[]);S.user={email:'modo-local',local:true};S.ready=true;route();return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.onAuthStateChanged(u=>{
   unsubs.forEach(f=>f());unsubs=[];S.ready=false;
   if(!u){S.user=null;S.lotes=[];S.eventos=[];route();return}
   S.user=u;let got=0;const ok=()=>{if(++got>=2){S.ready=true}onData()};
   unsubs.push(db.collection('lotes').onSnapshot(s=>{S.lotes=s.docs.map(d=>({...d.data(),id:d.id}));ok()},er=>toast('Sem permissão/erro em lotes: '+er.code,'e')));
   unsubs.push(db.collection('eventos').onSnapshot(s=>{S.eventos=s.docs.map(d=>({...d.data(),id:d.id}));ok()},er=>toast('Sem permissão/erro em registros: '+er.code,'e')));
   route();
  });
 },
 saveLote(l){l=clean(l);
  if(LOCAL){const i=S.lotes.findIndex(x=>x.id===l.id);i<0?S.lotes.push(l):S.lotes[i]=l;lsSet('gp_lotes',S.lotes);onData();return}
  db.collection('lotes').doc(l.id).set(l,{merge:true}).catch(e=>toast('Erro ao salvar: '+e.code,'e'))},
 saveEv(e){e=clean(e);
  if(LOCAL){const i=S.eventos.findIndex(x=>x.id===e.id);i<0?S.eventos.push(e):S.eventos[i]=e;lsSet('gp_eventos',S.eventos);onData();return}
  db.collection('eventos').doc(e.id).set(e).catch(er=>toast('Erro ao salvar: '+er.code,'e'))},
 delEv(id){
  if(LOCAL){S.eventos=S.eventos.filter(x=>x.id!==id);lsSet('gp_eventos',S.eventos);onData();return}
  db.collection('eventos').doc(id).delete().catch(er=>toast('Erro ao excluir: '+er.code,'e'))},
 delLote(id){const ids=S.eventos.filter(e=>e.loteId===id).map(e=>e.id);
  if(LOCAL){S.lotes=S.lotes.filter(l=>l.id!==id);S.eventos=S.eventos.filter(e=>e.loteId!==id);lsSet('gp_lotes',S.lotes);lsSet('gp_eventos',S.eventos);onData();return}
  for(let i=0;i<ids.length;i+=400){const b=db.batch();ids.slice(i,i+400).forEach(x=>b.delete(db.collection('eventos').doc(x)));b.commit()}
  db.collection('lotes').doc(id).delete()}
};
function onData(){_evm=null;if(!S.user)return;refresh()}
function evsLote(id){if(!_evm){_evm=new Map();for(const e of S.eventos){if(!_evm.has(e.loteId))_evm.set(e.loteId,[]);_evm.get(e.loteId).push(e)}}return _evm.get(id)||[]}

/* ====== CÁLCULOS ====== */
function aptosDe(evs,c){
 const s=new Set();
 evs.forEach(e=>{if(e.etapa==='dg30'&&e.ciclo===c&&e.resultado==='vazia'&&e.ressinc==='sim')s.add(e.animalId)});
 return s}
function esperado(lote,evs,et,c){
 const ids=(x,cc)=>new Set(evs.filter(e=>e.etapa===x&&e.ciclo===cc).map(e=>e.animalId));
 switch(et){
  case 'puberdade':return{ids:null,n:c===1?(parseInt(lote.qtd)||0):0};
  case 'd0':return c===1?{ids:null,n:parseInt(lote.qtd)||0}:{ids:aptosDe(evs,c-1)};
  case 'd8':return{ids:ids('d0',c)};
  case 'iatf':{const d=ids('d0',c);return{ids:d.size?d:ids('d8',c)}}
  default:return{ids:ids('iatf',c)};
 }}
function faltasEtapa(lote,evs,et,c){
 const reg=new Set(evs.filter(e=>e.etapa===et&&e.ciclo===c).map(e=>e.animalId));
 const ex=esperado(lote,evs,et,c);
 if(ex.ids){const miss=[...ex.ids].filter(i=>!reg.has(i));return{esp:ex.ids.size,reg:reg.size,falt:miss.length,ids:miss}}
 return{esp:ex.n,reg:reg.size,falt:Math.max(0,ex.n-reg.size),ids:null}}
function calc(lote,evs,ciclo){
 const cmax=Math.max(lote.cicloAtual||1,...evs.map(e=>e.ciclo||1));
 const E=ciclo==='todos'?evs:evs.filter(e=>e.ciclo===ciclo);
 const A=new Map();
 E.forEach(e=>{let a=A.get(e.animalId);if(!a){a={id:e.animalId,ev:{}};A.set(e.animalId,a)}(a.ev[e.etapa]=a.ev[e.etapa]||[]).push(e)});
 const last=(a,k)=>{const l=a.ev[k];return l?l.slice().sort((x,y)=>x.ciclo-y.ciclo).pop():null};
 const cs=ciclo==='todos'?range(1,cmax):[ciclo];
 const aptosSet=new Set();
 cs.forEach(c=>aptosDe(evs,c).forEach(id=>{if(!evs.some(e=>e.animalId===id&&e.etapa==='iatf'&&e.ciclo>c))aptosSet.add(id)}));
 const rows=[];
 A.forEach(a=>{
  const d0=last(a,'d0'),pb=last(a,'puberdade'),ia=last(a,'iatf'),g30x=last(a,'dg30'),gfx=last(a,'dgfinal');
  let g30=g30x,gf=gfx;
  if(ia&&g30&&g30.ciclo<ia.ciclo)g30=null;
  if(ia&&gf&&gf.ciclo<ia.ciclo)gf=null;
  let status='sem_dg',prov=false;
  if(gf)status=gf.resultado;else if(g30){status=g30.resultado==='prenhe'?'prenhe_ia':'vazia';prov=true}
  rows.push({id:a.id,categoria:(d0&&d0.categoria)||(pb&&pb.categoria)||lote.categoria||'—',touro:ia?(ia.touro||'—'):'—',
   insem:!!ia,status,prov,apto:aptosSet.has(a.id),g30,gf,ia,d0,ciclo:ciclo==='todos'?null:ciclo})});
 rows.sort((x,y)=>x.id.localeCompare(y.id,'pt-BR',{numeric:true}));
 const cnt=s=>rows.filter(r=>r.status===s).length;
 const insem=rows.filter(r=>r.insem).length,pIA=cnt('prenhe_ia'),pT=cnt('prenhe_touro'),vz=cnt('vazia');
 const aval=pIA+pT+vz;
 const fin=rows.filter(r=>r.gf),finP=fin.filter(r=>r.status!=='vazia').length;
 const prenhezIA=pct(rows.filter(r=>r.insem&&r.status==='prenhe_ia').length,insem);
 const prenhezFinal=pct(finP,fin.length);
 const faltas={};let faltTot=0;
 ETAPAS.forEach(et=>{
  let esp=0,reg=0,falt=0,ids=[],temIds=false;
  cs.forEach(c=>{const f=faltasEtapa(lote,evs,et.k,c);esp+=f.esp;reg+=f.reg;falt+=f.falt;if(f.ids){temIds=true;ids=ids.concat(f.ids)}});
  if(et.k==='puberdade'&&reg===0)esp=0,falt=0;
  faltas[et.k]={esp,reg,falt,ids:temIds?ids:null};faltTot+=falt});
 const grupo=(fn)=>{const m={};rows.filter(r=>r.insem).forEach(r=>{const k=fn(r);const g=m[k]=m[k]||{k,insem:0,pIA:0,pT:0,vz:0};g.insem++;if(r.status==='prenhe_ia')g.pIA++;else if(r.status==='prenhe_touro')g.pT++;else if(r.status==='vazia')g.vz++});return Object.values(m).sort((a,b)=>a.k.localeCompare(b.k,'pt-BR'))};
 return{rows,insem,pIA,pT,vz,aval,aptos:aptosSet.size,prenhezIA,prenhezFinal,nFin:fin.length,prov:rows.filter(r=>r.prov).length,faltas,faltTot,
  porCat:grupo(r=>r.categoria),porTouro:grupo(r=>r.touro)}}
function mergeGrupos(arrs){const m={};arrs.flat().forEach(g=>{const x=m[g.k]=m[g.k]||{k:g.k,insem:0,pIA:0,pT:0,vz:0};x.insem+=g.insem;x.pIA+=g.pIA;x.pT+=g.pT;x.vz+=g.vz});return Object.values(m).sort((a,b)=>a.k.localeCompare(b.k,'pt-BR'))}

/* ====== ROTEAMENTO ====== */
window.addEventListener('hashchange',route);
function route(){
 if(!S.user){return viewLogin()}
 const h=location.hash.replace(/^#\/?/,'').split('/');
 if(!h[0]){S.loteId=null;return viewHome()}
 if(h[0]==='novo')return viewLoteForm(null);
 if(h[0]==='lote'){
  const l=S.lotes.find(x=>x.id===h[1]);
  if(!l){if(!S.ready&&!LOCAL){return shell('Carregando…','<div class="empty">Carregando dados…</div>','')}location.hash='#/';return}
  if(h[2]==='editar')return viewLoteForm(l);
  if(S.loteId!==l.id){S.loteId=l.id;S.ciclo=l.cicloAtual||1;S.tab=S.tab||'d0';S.editId=null}
  return viewLote();
 }
 if(h[0]==='ind')return viewInd();
 if(h[0]==='conta')return viewConta();
 location.hash='#/';
}
function refresh(){
 const h=location.hash.replace(/^#\/?/,'').split('/')[0];
 if(h==='lote'&&$('#etapaBox')&&!location.hash.endsWith('editar'))return refreshLote();
 if(h===''||h==='ind')return route();
}
function shell(titulo,corpo,nav,acoes=''){
 $('#app').innerHTML=`${LOCAL&&S.user?'<div class="banner">Modo local de teste – dados salvos só neste aparelho. Configure o Firebase para sincronizar.</div>':''}
 <div class="hdr"><img src="${LOGO}" alt="GestPec"><h1>${titulo}</h1>${acoes}</div>
 <div class="wrap">${corpo}</div>
 <nav class="nav"><a href="#/" class="${nav==='lotes'?'on':''}"><span>🐄</span>Lotes</a><a href="#/ind" class="${nav==='ind'?'on':''}"><span>📊</span>Indicadores</a><a href="#/conta" class="${nav==='conta'?'on':''}"><span>⚙️</span>Conta</a></nav>`;
 window.scrollTo(0,0);
}

function buildEtapa(){
 const l=loteAtual(),box=$('#etapaBox');if(!l||!box)return;
 if(S.tab==='ind'){box.innerHTML='<div id="kpiBox"></div>';return}
 const et=ET(S.tab),ed=S.editId?S.eventos.find(e=>e.id===S.editId):null;
 const keep=(S.keep[et.k]=S.keep[et.k]||{});
 const val=n=>ed?ed[n]:keep[n];
 const fld=c=>{const v=val(c.n)??'';
  if(c.t==='sel')return `<label class="fld"><span>${c.l}</span><select name="${c.n}"><option value="">—</option>${c.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;

  if(v!==''&&v!=null)o[cp.n]=v}

 y=secPdf(doc,y,'Resultado por touro',['Touro','Insem.','Prenhe IA','Prenhe touro','Vazia','% IA'],c.porTouro.map(rowG));
 doc.addPage();y=16;
 secPdf(doc,y,'Historico individual por animal (todos os ciclos)',['ID','Categoria','Touro','Data IA','DG 30','DG final','Situacao'],c.rows.map(r=>[r.id,r.categoria,r.touro,r.ia?fmtData(r.ia.data):'-',r.g30?VAL[r.g30.resultado]:'-',r.gf?VAL[r.gf.resultado]:'-',STATUS[r.status]+(r.apto?' (ressinc.)':'')]));
 rodape(doc);doc.save(`GestPec_IATF_${slug(l.fazenda)}_Lote_${slug(l.lote)}.pdf`);
}
function pdfGeral(){
 const fz=S.fz||'',ls=S.lotes.filter(l=>!fz||l.fazenda===fz),cs=ls.map(l=>({l,c:calc(l,evsLote(l.id),'todos')}));
 const tot=cs.reduce((a,x)=>({i:a.i+x.c.insem,p:a.p+x.c.pIA,t:a.t+x.c.pT,v:a.v+x.c.vz}),{i:0,p:0,t:0,v:0});
 const {doc,y:y0}=pdfBase('Relatorio geral de IATF',(fz||'Todas as fazendas')+`  |  ${ls.length} lote(s)  |  Inseminadas: ${tot.i}  |  Prenhez IA: ${fmtPct(pct(tot.p,tot.i))}`);
 let y=secPdf(doc,y0,'Resultado por lote',['Lote','Insem.','Prenhe IA','Prenhe touro','Vazia','% IA'],cs.map(x=>rowG({k:x.l.fazenda+' - '+x.l.lote,insem:x.c.insem,pIA:x.c.pIA,pT:x.c.pT,vz:x.c.vz})));
 y=secPdf(doc,y,'Resultado por categoria',['Categoria','Insem.','Prenhe IA','Prenhe touro','Vazia','% IA'],mergeGrupos(cs.map(x=>x.c.porCat)).map(rowG));
 secPdf(doc,y,'Resultado por touro',['Touro','Insem.','Prenhe IA','Prenhe touro','Vazia','% IA'],mergeGrupos(cs.map(x=>x.c.porTouro)).map(rowG));
 rodape(doc);doc.save('GestPec_IATF_Geral.pdf');
}

/* ====== AÇÕES (delegação de eventos) ====== */
const ACT={
 tab(t){S.tab=t.dataset.k;S.editId=null;buildEtapa();refreshLote()},
 edit(t){S.editId=t.dataset.id;buildEtapa();refreshLote();window.scrollTo({top:0,behavior:'smooth'})},
 cancelEdit(){S.editId=null;buildEtapa();refreshLote()},
 del(t){const e=S.eventos.find(x=>x.id===t.dataset.id);if(e&&confirm('Excluir registro de '+e.animalId+'?'))Store.delEv(e.id)},
 hist(t){histAnimal(t.dataset.id)},
 pick(t){const i=$('#aid');if(i){i.value=t.dataset.id;i.focus();window.scrollTo({top:0,behavior:'smooth'})}},
 agora(t){const i=$(`[name="${t.dataset.t}"]`);if(i)i.value=agora()},
 closeModal,
 novoCiclo(){const l=loteAtual(),c=calc(l,evsLote(l.id),S.ciclo);
  if(!confirm(`Iniciar ciclo ${(l.cicloAtual||1)+1} com ${c.aptos} animais aptos à ressincronização?`))return;
  l.cicloAtual=(l.cicloAtual||1)+1;Store.saveLote(l);S.ciclo=l.cicloAtual;S.tab='d0';S.editId=null;buildEtapa();refreshLote();toast('Ciclo '+l.cicloAtual+' iniciado')},
 menu(){const l=loteAtual();modal(`<div class="row" style="flex-direction:column;align-items:stretch"><a class="btn ghost" href="#/lote/${l.id}/editar" data-act="closeModal">✏️ Editar dados do lote</a><button class="btn ghost" data-act="pdf">📄 Relatório PDF</button><button class="btn ghost" data-act="csv">⬇ Planilha CSV</button><button class="btn red" data-act="delLote">🗑 Excluir lote e registros</button><button class="btn ghost" data-act="closeModal">Fechar</button></div>`)},
 pdf(){closeModal();try{pdfLote()}catch(e){toast('Erro ao gerar PDF (precisa de internet na 1ª vez): '+e.message,'e')}},
 pdfGeral(){try{pdfGeral()}catch(e){toast('Erro ao gerar PDF: '+e.message,'e')}},
 csv(){closeModal();const l=loteAtual();baixar(`GestPec_IATF_${slug(l.fazenda)}_Lote_${slug(l.lote)}.csv`,csvLote(l),'text/csv;charset=utf-8')},
 delLote(){const l=loteAtual();closeModal();if(confirm(`Excluir o lote ${l.lote} e TODOS os registros dele? Não dá para desfazer.`)){Store.delLote(l.id);S.loteId=null;location.hash='#/';toast('Lote excluído')}},
 backup(){baixar('gestpec_backup.json',JSON.stringify({lotes:S.lotes,eventos:S.eventos},null,1),'application/json')},
 logout(){auth.signOut()},
 async signup(){const e=$('#le').value.trim(),p=$('#lp').value;if(!e||p.length<6)return toast('Informe e-mail e senha (mín. 6)','e');try{await auth.createUserWithEmailAndPassword(e,p)}catch(er){toast(msgAuth(er),'e')}},
 async reset(){const e=$('#le').value.trim();if(!e)return toast('Digite o e-mail primeiro','e');try{await auth.sendPasswordResetEmail(e);toast('E-mail de redefinição enviado')}catch(er){toast(msgAuth(er),'e')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(!a)return;if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();a(t)});

/* ====== PWA ====== */
(function pwa(){
 try{
  const cv=document.createElement('canvas');cv.width=cv.height=512;const x=cv.getContext('2d'),im=new Image();
  im.onload=()=>{x.fillStyle='#fff';x.fillRect(0,0,512,512);const w=400,h=w*im.height/im.width;x.drawImage(im,56,(512-h)/2,w,h);
   const ic=cv.toDataURL('image/png');
   const man={name:'GestPec – IATF',short_name:'GestPec',start_url:'./',display:'standalone',background_color:'#ffffff',theme_color:'#14307a',icons:[{src:ic,sizes:'512x512',type:'image/png',purpose:'any'}]};
   const lk=document.createElement('link');lk.rel='manifest';lk.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));document.head.appendChild(lk);
   const ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=ic;document.head.appendChild(ap)};
  im.src=LOGO;
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
 }catch(e){}
})();

Store.init();
